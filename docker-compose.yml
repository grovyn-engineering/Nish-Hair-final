services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nish-hair-studio
    restart: always
    expose:
      - "3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - VITE_EXTERNAL_API_URL=${VITE_EXTERNAL_API_URL:-}
      - EXTERNAL_API_URL=${EXTERNAL_API_URL:-}
      - VITE_PHOTO_CHECK_BACKEND_URL=${VITE_PHOTO_CHECK_BACKEND_URL:-/api}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  photo-check-backend:
    build:
      context: ./backend/velura-photo-check
      dockerfile: Dockerfile
    container_name: nishhair-photo-check
    expose:
      - "8000"
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: nishhair-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - photo-check-backend
