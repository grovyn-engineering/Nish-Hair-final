version: "3.8"

services:
  nish-hair-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nish-hair-studio
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - TRYITON_API_KEY=${TRYITON_API_KEY:-}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
