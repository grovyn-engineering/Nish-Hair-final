version: '3.8'

services:
  nish-hair-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nish-hair-studio
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - TRYITON_API_KEY=${TRYITON_API_KEY:-}
      - VITE_PHOTO_CHECK_BACKEND_URL=${VITE_PHOTO_CHECK_BACKEND_URL:-http://photo-check-backend:8000}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nishhair-network
    depends_on:
      - photo-check-backend

  photo-check-backend:
    build:
      context: ./backend/velura-photo-check
      dockerfile: Dockerfile
    container_name: nishhair-photo-check
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - nishhair-network

networks:
  nishhair-network:
    driver: bridge
